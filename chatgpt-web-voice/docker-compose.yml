services:
  chatgpt-web-voice:
    image: ghcr.io/space3044/chatgpt-web-voice:main
    pull_policy: always
    container_name: chatgpt-web-voice
    network_mode: host
    mem_limit: 256m
    environment:
      VOICE_AUTH_USERNAME: ""
      VOICE_AUTH_PASSWORD: ""
      VOICE_TURNSTILE_SITE_KEY: ""
      VOICE_TURNSTILE_SECRET_KEY: ""
      VOICE_TOKEN_ENCRYPTION_KEY: ""
      VOICE_TRUST_CLOUDFLARE_IP: "true"
      VOICE_PUBLIC_SESSION_RATE_LIMIT_PER_MINUTE: "10"
      VOICE_PUBLIC_WRITE_RATE_LIMIT_PER_MINUTE: "60"
      VOICE_TLS: "false"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
